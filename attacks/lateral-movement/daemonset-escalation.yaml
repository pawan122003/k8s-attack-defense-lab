---
# Detection helper
apiVersion: v1
kind: Pod
metadata:
  name: daemonset-detection-check
  namespace: daemonset-escalation
  labels:
    tool: detector
spec:
  serviceAccountName: detector-sa
  containers:
  - name: detector
    image: curlimages/curl:latest
    command:
    - sh
    - -c
    - |
      echo "=== DaemonSet Escalation Detection Check ==="
      
      echo "[*] Checking for suspicious DaemonSets..."
      
      # Would check:
      # kubectl get daemonsets -A
      # kubectl get daemonsets -A -o json | jq '.items[] | select(.spec.template.spec.securityContext.privileged == true)'
      
      echo "[*] Red flags to look for:"
      echo "  ✗ DaemonSets with privileged: true"
      echo "  ✗ DaemonSets with hostPID: true"
      echo "  ✗ DaemonSets with hostNetwork: true"
      echo "  ✗ DaemonSets outside system namespaces"
      echo "  ✗ DaemonSets with unusual images"
      echo "  ✗ DaemonSets running as non-system users"
      
      echo ""
      echo "[*] Current DaemonSets in cluster:"
      kubectl get daemonsets -A 2>/dev/null || echo "Cannot enumerate"
      
      sleep 3600

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: detector-sa
  namespace: daemonset-escalation

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daemonset-detector
rules:
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daemonset-detector-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daemonset-detector
subjects:
- kind: ServiceAccount
  name: detector-sa
  namespace: daemonset-escalation
