input {
  kubernetes {
    host => "kubernetes.default.svc"
    ca_file => "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    token => "/var/run/secrets/kubernetes.io/serviceaccount/token"
    namespace_name => "default"
  }

  http {
    port => 8080
    codec => json
  }
}

filter {
  if [kubernetes][labels][app] == "falco" {
    json {
      source => "message"
      target => "falco"
    }

    mutate {
      add_field => {
        "event_type" => "security"
        "severity" => "%{[falco][priority]}"
      }
    }
  }

  if [kubernetes][labels][security-scenario] {
    mutate {
      add_field => {
        "event_type" => "attack-scenario"
        "scenario" => "%{[kubernetes][labels][security-scenario]}"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "k8s-security-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
