apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: k8s-security-lab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/your-org/k8s-attack-defense-lab
  ref:
    branch: main
  ignore: |
    # exclude all
    /*
    # include kubernetes manifests
    !/cluster/
    !/defenses/
    !/monitors/
    !/policies/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: cluster-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-security-lab
  validation: client
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: security-defenses
  namespace: flux-system
spec:
  interval: 5m
  path: ./defenses
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-security-lab
  dependsOn:
    - name: cluster-config
  validation: client
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: monitoring-stack
  namespace: flux-system
spec:
  interval: 5m
  path: ./monitors
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-security-lab
  dependsOn:
    - name: security-defenses
  validation: client
