apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api-server
  namespace: community
  labels:
    app: lab-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-api
  template:
    metadata:
      labels:
        app: lab-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: api-server
        image: golang:1.21-alpine
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 65534
          capabilities:
            drop:
              - ALL
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 60
        ports:
        - containerPort: 8080
        env:
        - name: KUBECONFIG
          value: /etc/kubernetes/admin.conf
        volumeMounts:
        - name: kubeconfig
          mountPath: /etc/kubernetes
        - name: api-code
          mountPath: /app
        command: ["/app/api-server"]
      volumes:
      - name: kubeconfig
        secret:
          secretName: kubeconfig
      - name: api-code
        configMap:
          name: api-server-code
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
  namespace: community
spec:
  selector:
    app: lab-api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: community
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.k8s-lab.local
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: lab-api
            port:
              number: 80
