# Pod Anti-Affinity Rules for High Availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-ha
  namespace: falco
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - falco
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - falco
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: falco
        image: falcosecurity/falco:latest
        # ... rest of falco configuration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-ha
  namespace: kyverno
spec:
  replicas: 3
